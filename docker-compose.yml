name: portfolio-meshack

services:
  database:
    restart: always
    image: postgres:14
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - database_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - back-end
  redis:
    image: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - back-end

  app:
    restart: always
    build:
      context: .
      dockerfile: docker/Dockerfile
    expose:
      - "8000"
    image: portfolio-meshack-app
    volumes:
      - .:/portfolio-app
      - static_volume:/portfolio-app/staticfiles/
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint:
      [
        "/bin/bash",
        "-c",
        "/portfolio-app/docker/start_api.sh"
      ]
    networks:
      - back-end
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DEBUG=${DEBUG}
      - DB_NAME=${DB_NAME}
      - DB_HOST=database
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-meshack.tech}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - TO_EMAIL=${TO_EMAIL}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  proxy:
    image: portfolio-meshack-proxy
    build:
      context: .
      dockerfile: nginx/nginx.Dockerfile
    expose:
      - "81"
    networks:
      - back-end
      - edge
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/portfolio-app/staticfiles/:ro
    restart: always
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.portfolio-meshack.rule=Host(`meshack.tech`)
      - traefik.http.routers.portfolio-meshack.entrypoints=websecure
      - traefik.http.routers.portfolio-meshack.tls=true
      - traefik.http.routers.portfolio-meshack.tls.certresolver=letsencrypt
      - traefik.http.services.portfolio-meshack.loadbalancer.server.port=81

networks:
  back-end:
  edge:
    external: true
    name: edge
volumes:
  static_volume:
  database_volume:
